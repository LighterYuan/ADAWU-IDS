run_name: paper_main
method: ADAWU-IDS
dataset: CICIDS2017
protocol: chronological_chunk_eval

seed: 42
chunk_size: 5000
sequence_length: 10

drift:
  msdi_threshold: 0.30
  mild_threshold: 0.30
  moderate_threshold: 0.50
  severe_threshold: 0.70

ensemble:
  n_models: 3
  alpha: 0.60
  beta: 0.25
  gamma: 0.15
  lambda_decay: 0.10
  min_weight: 0.05

paths:
  trace_dir: results/traces
  summary_dir: results/summaries
  figure_dir: results/figures
  table_dir: results/tables
  log_dir: results/logs
  manifest_dir: results/manifests
